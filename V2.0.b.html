<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圆域猎手 - GCSE圆几何游戏</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --panel-bg: #ffffff;
            --text-color: #212121;
            --border-color: #e0e0e0;
            --color-circle: #ff4444;
            --color-center: #44dd44;
            --color-outer: #ffdd44;
            --color-line: #2196f3;
            --color-monster: #ff4444;
            --color-bullet: #ffff00;
            --font-size: 16px;
            --btn-size: 48px;
            --canvas-max-size: 800px;
            --gap: 12px;
            --radius: 8px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --border-color: #333333;
            --color-circle: #ff6666;
            --color-center: #66ee66;
            --color-outer: #ffee66;
            --color-line: #64b5f6;
        }

        [data-colorblind="true"] {
            --color-circle: #377eb8;
            --color-center: #4daf4a;
            --color-outer: #984ea3;
        }

        [data-font="small"] { --font-size: 14px; }
        [data-font="medium"] { --font-size: 16px; }
        [data-font="large"] { --font-size: 18px; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: var(--font-size);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: var(--gap);
            transition: all 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--gap);
            background-color: var(--panel-bg);
            border-radius: var(--radius);
            margin-bottom: var(--gap);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: var(--gap);
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-label {
            font-size: 0.875em;
            opacity: 0.7;
        }

        .exp-bar-container {
            flex: 1;
            min-width: 200px;
            height: 20px;
            background-color: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .exp-bar {
            height: 100%;
            background: linear-gradient(90deg, #2196f3, #64b5f6);
            width: 0%;
            transition: width 0.3s ease;
        }

        main {
            display: flex;
            gap: var(--gap);
            margin-bottom: var(--gap);
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-container {
            position: relative;
            display: inline-block;
        }

        #gameCanvas {
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background-color: var(--panel-bg);
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .pause-btn:hover {
            background-color: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
        }

        .pause-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .pause-icon {
            font-family: monospace;
            font-weight: bold;
        }

        aside {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            min-width: 200px;
            max-width: 300px;
            flex: 1;
        }

        .panel-section {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--gap);
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .panel-title {
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--gap);
        }

        .point-buttons {
            display: flex;
            justify-content: space-around;
            gap: var(--gap);
        }

        .point-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .point-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .point-label {
            font-size: 0.75em;
            text-align: center;
        }

        .point-btn:hover, .point-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 10px currentColor;
        }

        .point-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #circlePointBtn {
            background-color: var(--color-circle);
            border-radius: 50%;
        }

        #centerPointBtn {
            background-color: var(--color-center);
            border-radius: 4px;
        }

        #outerPointBtn {
            background-color: var(--color-outer);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .func-btn {
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            background-color: #2196f3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .func-btn:hover {
            background-color: #1976d2;
        }

        .func-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .func-btn.danger {
            background-color: #f44336;
        }

        .func-btn.danger:hover {
            background-color: #d32f2f;
        }

        .talent-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .talent-item {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 0.875em;
        }

        .talent-item.locked {
            opacity: 0.5;
        }

        .talent-item.unlocked {
            border-color: #4caf50;
            background-color: rgba(76, 175, 80, 0.1);
        }

        footer {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--gap);
            margin-bottom: var(--gap);
            min-height: 60px;
        }

        #theoremLabel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .theorem-tag {
            padding: 4px 8px;
            border-radius: 4px;
            background-color: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196f3;
            font-size: 0.875em;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--gap);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border-radius: var(--radius);
            padding: calc(var(--gap) * 2);
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--gap);
        }

        .modal-buttons {
            display: flex;
            gap: var(--gap);
            justify-content: center;
            margin-top: var(--gap);
        }

        .levelup-options {
            display: flex;
            gap: var(--gap);
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .levelup-option {
            flex: 1;
            min-width: 120px;
            padding: var(--gap);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .levelup-option:hover {
            transform: scale(1.05);
            border-color: #2196f3;
        }

        .option-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .setting-switch {
            width: 48px;
            height: 24px;
            background-color: var(--border-color);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
        }

        .setting-switch.active {
            background-color: #4caf50;
        }

        .setting-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            top: 2px;
            left: 2px;
            transition: all 0.2s ease;
        }

        .setting-switch.active::after {
            left: 26px;
        }

        .setting-select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <header>
        <div class="status-item">
            <span class="status-label" data-i18n="centerHealth">圆心血量</span>
            <span id="centerHealthText">3</span>
        </div>
        <div class="status-item">
            <span class="status-label" data-i18n="level">等级</span>
            <span id="levelText">1</span>
        </div>
        <div class="exp-bar-container">
            <div class="exp-bar" id="expBar"></div>
        </div>
        <div class="status-item">
            <span class="status-label" data-i18n="score">分数</span>
            <span id="scoreText">0</span>
        </div>
        <div class="status-item">
            <span class="status-label" data-i18n="wave">波次</span>
            <span id="waveText">1</span>
        </div>
        <button class="func-btn" id="settingBtn" data-i18n="setting">设置</button>
    </header>

    <main>
        <div class="game-container">
            <canvas id="gameCanvas" width="800" height="800"></canvas>
            <button class="pause-btn" id="pauseBtn" disabled>
                <span class="pause-icon">❚❚</span>
            </button>
        </div>
        <aside>
            <div class="panel-section">
                <div class="panel-title" data-i18n="pointSelect">选择放置点</div>
                <div class="point-buttons">
                    <div class="point-btn-container">
                        <button class="point-btn" id="circlePointBtn" aria-label="圆周点"></button>
                        <span class="point-label" data-i18n="circlePoint">圆周点</span>
                    </div>
                    <div class="point-btn-container">
                        <button class="point-btn" id="centerPointBtn" aria-label="圆心点"></button>
                        <span class="point-label" data-i18n="centerPoint">圆心点</span>
                    </div>
                    <div class="point-btn-container">
                        <button class="point-btn" id="outerPointBtn" aria-label="圆外点"></button>
                        <span class="point-label" data-i18n="outerPoint">圆外点</span>
                    </div>
                </div>
                <div class="point-count">
                    <span data-i18n="pointCount">点数库存：</span>
                    <span id="circleCount">0</span> | <span id="centerCount">0</span> | <span id="outerCount">0</span>
                </div>
            </div>

            <div class="panel-section">
                <button class="func-btn" id="startBtn" data-i18n="restart">重新开始</button>
                <button class="func-btn" id="placeDefenseBtn" disabled data-i18n="placeDefense">放置防御点</button>
            </div>

            <div class="panel-section">
                <div class="panel-title" data-i18n="selectedTalents">已选择天赋</div>
                <div class="talent-list" id="selectedTalentsList"></div>
            </div>
        </aside>
    </main>

    <footer>
        <div id="theoremLabel">
            <span data-i18n="noTheorem">暂无触发的定理，放置点并闭合几何图形以激活</span>
        </div>
    </footer>

    <div class="modal" id="startModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="gameTitle">圆域猎手</div>
            <p data-i18n="gameDesc">放置圆心点/圆周点/圆外点，触发GCSE圆定理生成攻击，守护圆心！</p>
            <p data-i18n="gameTip">圆心点仅可放中心，圆周点仅可放圆上，圆外点仅可放圆外</p>
            <div class="modal-buttons">
                <button class="func-btn" id="confirmStartBtn" data-i18n="startGame">开始游戏</button>
            </div>
        </div>
    </div>

    <div class="modal" id="levelUpModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="levelUp">升级了！</div>
            <div class="levelup-options">
                <div class="levelup-option" id="circleOption">
                    <div class="option-icon" style="background-color: var(--color-circle); border-radius: 50%;"></div>
                    <span data-i18n="circlePoint">圆周点</span>
                </div>
                <div class="levelup-option" id="centerOption">
                    <div class="option-icon" style="background-color: var(--color-center); border-radius: 4px;"></div>
                    <span data-i18n="centerPoint">圆心点</span>
                </div>
                <div class="levelup-option" id="outerOption">
                    <div class="option-icon" style="background-color: var(--color-outer); clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>
                    <span data-i18n="outerPoint">圆外点</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="placeDefenseModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="placeDefense">放置防御点</div>
            <p data-i18n="needMorePoints">需要至少3个点才能开始防御！</p>
            <p id="currentPointsText">当前点数：0</p>
            <div class="modal-buttons">
                <button class="func-btn" id="cancelDefenseBtn" data-i18n="cancel">取消并返还</button>
                <button class="func-btn" id="continueAddBtn" data-i18n="continue">继续添加</button>
            </div>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="gameOver">游戏结束</div>
            <p data-i18n="finalScore">最终分数：<span id="finalScoreText">0</span></p>
            <p data-i18n="finalWave">坚持波次：<span id="finalWaveText">0</span></p>
            <p data-i18n="highScore">最高分：<span id="highScoreText">0</span></p>
            <div class="modal-buttons">
                <button class="func-btn" id="restartBtn" data-i18n="restart">重新开始</button>
            </div>
        </div>
    </div>

    <div class="modal" id="settingModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="setting">设置</div>
            <div class="setting-item">
                <span data-i18n="language">语言</span>
                <select class="setting-select" id="languageSelect">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="setting-item">
                <span data-i18n="darkMode">深色模式</span>
                <div class="setting-switch" id="darkModeSwitch"></div>
            </div>
            <div class="setting-item">
                <span data-i18n="colorblindMode">色盲友好模式</span>
                <div class="setting-switch" id="colorblindSwitch"></div>
            </div>
            <div class="setting-item">
                <span data-i18n="fontSize">字体大小</span>
                <select class="setting-select" id="fontSizeSelect">
                    <option value="small">小</option>
                    <option value="medium" selected>中</option>
                    <option value="large">大</option>
                </select>
            </div>
            <div class="setting-item">
                <span data-i18n="sfx">音效</span>
                <div class="setting-switch active" id="sfxSwitch"></div>
            </div>
            <div class="modal-buttons">
                <button class="func-btn" id="closeSettingBtn" data-i18n="confirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        const gameState = {
            status: 'idle',
            canvas: { width: 800, height: 800, centerX: 400, centerY: 400, radius: 266 },
            player: {
                level: 1, exp: 0, expToNextLevel: 100,
                points: { circle: 1, center: 1, outer: 1 },
                unlockedTalents: [], damageMultiplier: 1, bulletCountMultiplier: 1
            },
            geometry: {
                placedPoints: [], maxPoints: 5, lines: [], activeTheorems: [],
                isClosed: false, selectedPointType: 'circle'
            },
            savedGeometries: [], // 保存已闭合的几何图形
            combat: {
                baseDamage: 10, monsters: [], bullets: [], wave: 1, score: 0,
                lastWaveTime: 0, waveInterval: 10000, lastBulletTime: 0, bulletInterval: 500
            },
            settings: { language: 'zh', darkMode: false, colorblindMode: false, fontSize: 'medium', sfx: true },
            isPlacingMode: false,
            centerHealth: 3
        };

        const i18n = {
            zh: {
                level: '等级', score: '分数', wave: '波次', setting: '设置', pointSelect: '选择放置点',
                circlePoint: '圆周点', centerPoint: '圆心点', outerPoint: '圆外点', pointCount: '点数库存：',
                startGame: '开始游戏', pause: '暂停', resume: '继续', closeShape: '几何闭合', clearPoints: '清除所有点',
                placeDefense: '放置防御点', confirmPlacement: '确认放置', needMorePoints: '需要至少3个点才能开始防御！',
                cancel: '取消并返还', continue: '继续添加', clickToPlaceDefense: '点击"放置防御点"开始放置',
                talent: '天赋树', noTheorem: '暂无触发的定理', gameTitle: '圆域猎手',
                gameDesc: '放置圆心点/圆周点/圆外点，触发GCSE圆定理生成攻击，守护圆心！',
                gameTip: '圆心点仅可放中心，圆周点仅可放圆上，圆外点仅可放圆外',
                levelUp: '升级了！', levelUpDesc: '选择一种点数', gameOver: '游戏结束',
                finalScore: '最终分数：', finalWave: '坚持波次：', highScore: '最高分：',
                restart: '重新开始', language: '语言', darkMode: '深色模式', colorblindMode: '色盲友好模式',
                fontSize: '字体大小', sfx: '音效', confirm: '确认', centerHealth: '圆心血量',
                theorem1: '圆心角=2×圆周角', theorem2: '半圆直角90°', theorem3: '内接四边形对角互补',
                theorem4: '切线⊥半径', theorem5: '双切线等长', theorem6: '弦垂直平分线过圆心',
                theorem7: '等弦等角', theorem8: '相交弦定理'
            },
            en: {
                level: 'Level', score: 'Score', wave: 'Wave', setting: 'Setting', pointSelect: 'Select Point',
                circlePoint: 'Circle', centerPoint: 'Center', outerPoint: 'Outer', pointCount: 'Points: ',
                startGame: 'Start', pause: 'Pause', resume: 'Resume', closeShape: 'Close', clearPoints: 'Clear',
                placeDefense: 'Place Defense', confirmPlacement: 'Confirm Placement', needMorePoints: 'Need at least 3 points to start defense!',
                cancel: 'Cancel & Return', continue: 'Continue Adding', clickToPlaceDefense: 'Click "Place Defense" to start',
                talent: 'Talents', noTheorem: 'No Theorem', gameTitle: 'Circle Hunter',
                gameDesc: 'Place Center/Circle/Outer points, trigger GCSE theorems to attack!',
                gameTip: 'Center: only middle | Circle: only edge | Outer: only outside',
                levelUp: 'Level Up!', levelUpDesc: 'Choose a point', gameOver: 'Game Over',
                finalScore: 'Score: ', finalWave: 'Wave: ', highScore: 'High Score: ',
                restart: 'Restart', language: 'Language', darkMode: 'Dark', colorblindMode: 'Colorblind',
                fontSize: 'Font', sfx: 'SFX', confirm: 'OK', centerHealth: 'Core HP',
                theorem1: 'Central=2×Circumference', theorem2: 'Semicircle 90°', theorem3: 'Cyclic Quadrilateral',
                theorem4: 'Tangent⊥Radius', theorem5: 'Equal Tangents', theorem6: 'Chord Bisector',
                theorem7: 'Equal Chords', theorem8: 'Intersect Chords'
            }
        };

        const talentTree = [
            {id:'t1',name:{zh:'圆心角倍击',en:'Double'},desc:{zh:'伤害翻倍',en:'Damage x2'},level:5,effect:s=>s.player.damageMultiplier*=2},
            {id:'t2',name:{zh:'半圆震慑',en:'Stun'},desc:{zh:'定身敌人',en:'Stun'},level:10,effect:s=>s.player.damageMultiplier*=1.5},
            {id:'t3',name:{zh:'切线穿透',en:'Penetrate'},desc:{zh:'子弹穿透',en:'Penetrate'},level:15,effect:s=>s.player.damageMultiplier*=1.5},
            {id:'t4',name:{zh:'双切连击',en:'Combo'},desc:{zh:'伤害联动',en:'Combo'},level:20,effect:s=>s.player.damageMultiplier*=1.5},
            {id:'t5',name:{zh:'四边形爆轰',en:'Blast'},desc:{zh:'范围爆炸',en:'Blast'},level:25,effect:s=>s.player.damageMultiplier*=2},
            {id:'t6',name:{zh:'弦平分减速',en:'Slow'},desc:{zh:'减速敌人',en:'Slow'},level:30,effect:s=>s.player.damageMultiplier*=1.5},
            {id:'t7',name:{zh:'等弦护盾',en:'Shield'},desc:{zh:'生成护盾',en:'Shield'},level:35,effect:s=>s.player.damageMultiplier*=1.5},
            {id:'t8',name:{zh:'相交弦增伤',en:'Boost'},desc:{zh:'伤害提升',en:'Boost'},level:40,effect:s=>s.player.damageMultiplier*=2},
            {id:'t9',name:{zh:'全域强化',en:'Global'},desc:{zh:'全属性提升',en:'Global Boost'},level:45,effect:s=>{s.player.damageMultiplier*=2;s.player.bulletCountMultiplier*=2}}
        ];

        function getDistance(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
        function getTangentPoints(ox,oy,cx,cy,r){const dx=ox-cx,dy=oy-cy,d2=dx*dx+dy*dy,r2=r*r;if(d2<r2)return[];const s=Math.sqrt(d2-r2);return[{x:cx+(r2*dx-r*dy*s)/d2,y:cy+(r2*dy+r*dx*s)/d2},{x:cx+(r2*dx+r*dy*s)/d2,y:cy+(r2*dy-r*dx*s)/d2}]}
        function isPointOnLine(px,py,x1,y1,x2,y2,t=10){const d=Math.abs((y2-y1)*px-(x2-x1)*py+x2*y1-y2*x1)/Math.hypot(y2-y1,x2-x1);if(d>t)return!1;const mx=Math.min(x1,x2)-t,xx=Math.max(x1,x2)+t,my=Math.min(y1,y2)-t,xy=Math.max(y1,y2)+t;return px>=mx&&px<=xx&&py>=my&&py<=xy}
        function getNearestMonster(x,y){if(!gameState.combat.monsters.length)return null;let n=null,m=Infinity;gameState.combat.monsters.forEach(mo=>{const d=getDistance(x,y,mo.x,mo.y);if(d<m){m=d;n=mo}});return n}

        function playSound(f,d){if(!gameState.settings.sfx)return;const a=new AudioContext();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(0.3,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+d);o.start();o.stop(a.currentTime+d)}
        const sounds={click:()=>playSound(440,0.1),place:()=>playSound(880,0.15),close:()=>playSound(660,0.2),kill:()=>playSound(220,0.1),level:()=>playSound(1100,0.3)};

        function applyLanguage(){const l=gameState.settings.language;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=i18n[l][e.dataset.i18n])}
        function applySettings(){document.documentElement.setAttribute('data-theme',gameState.settings.darkMode?'dark':'light');document.documentElement.setAttribute('data-colorblind',gameState.settings.colorblindMode);document.documentElement.setAttribute('data-font',gameState.settings.fontSize);applyLanguage()}
        function saveSettings(){localStorage.setItem('ch',JSON.stringify(gameState.settings))}
        function loadSettings(){const s=localStorage.getItem('ch');if(s){gameState.settings=JSON.parse(s);document.getElementById('languageSelect').value=gameState.settings.language;document.getElementById('darkModeSwitch').classList.toggle('active',gameState.settings.darkMode);document.getElementById('colorblindSwitch').classList.toggle('active',gameState.settings.colorblindMode);document.getElementById('fontSizeSelect').value=gameState.settings.fontSize;document.getElementById('sfxSwitch').classList.toggle('active',gameState.settings.sfx)}applySettings()}

        class Point{constructor(x,y,t){this.x=x;this.y=y;this.type=t}draw(ctx){ctx.beginPath();switch(this.type){case'circle':ctx.arc(this.x,this.y,8,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--color-circle');break;case'center':ctx.rect(this.x-6,this.y-6,12,12);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--color-center');break;case'outer':ctx.moveTo(this.x,this.y-8);ctx.lineTo(this.x-8,this.y+8);ctx.lineTo(this.x+8,this.y+8);ctx.closePath();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--color-outer');break;}ctx.fill()}}
        class Line{constructor(x1,y1,x2,y2,t){this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;this.type=t}draw(ctx){ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(this.x2,this.y2);ctx.strokeStyle='var(--color-line)';ctx.lineWidth=3;ctx.stroke()}}
        class Monster{constructor(x,y,t,w){this.x=x;this.y=y;this.type=t;this.wave=w;this.hp=20;this.speed=0.5;this.r=8}move(){const {centerX,centerY}=gameState.canvas;const dx=centerX-this.x,dy=centerY-this.y,d=Math.hypot(dx,dy);if(d)this.x+=dx/d*this.speed,this.y+=dy/d*this.speed}hit(d){this.hp-=d;return this.hp<=0}draw(ctx){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='var(--color-monster)';ctx.fill();ctx.fillStyle='red';ctx.fillRect(this.x-this.r,this.y-this.r-5,this.r*2*(this.hp/20),3)}}
        class Bullet{constructor(x,y,t,d){this.x=x;this.y=y;this.target=t;this.damage=d;this.speed=5;this.r=3}move(){if(!this.target||this.target.hp<=0)this.target=getNearestMonster(this.x,this.y);if(!this.target)return!1;const dx=this.target.x-this.x,dy=this.target.y-this.y,d=Math.hypot(dx,dy);if(d)this.x+=dx/d*this.speed,this.y+=dy/d*this.speed;return!0}hit(){if(!this.target)return!1;return getDistance(this.x,this.y,this.target.x,this.target.y)<=this.r+this.target.r}draw(ctx){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='var(--color-bullet)';ctx.fill()}}

        const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let anim=null;

        function updateUI(){
            document.getElementById('centerHealthText').textContent=gameState.centerHealth;
            document.getElementById('levelText').textContent=gameState.player.level;
            document.getElementById('scoreText').textContent=gameState.combat.score;
            document.getElementById('waveText').textContent=gameState.combat.wave;
            document.getElementById('expBar').style.width=Math.min((gameState.player.exp/gameState.player.expToNextLevel)*100,100)+'%';
            document.getElementById('circleCount').textContent=gameState.player.points.circle;
            document.getElementById('centerCount').textContent=gameState.player.points.center;
            document.getElementById('outerCount').textContent=gameState.player.points.outer;
            
            const full=gameState.geometry.placedPoints.length>=gameState.geometry.maxPoints;
            const isPlacing = gameState.isPlacingMode;
            
            // 只有在放置模式下才能放置点
            document.getElementById('circlePointBtn').disabled=!isPlacing||gameState.player.points.circle<=0||full;
            document.getElementById('centerPointBtn').disabled=!isPlacing||gameState.player.points.center<=0||full;
            document.getElementById('outerPointBtn').disabled=!isPlacing||gameState.player.points.outer<=0||full;
            
            const totalPoints = gameState.player.points.circle + gameState.player.points.center + gameState.player.points.outer;

            document.getElementById('pauseBtn').disabled=gameState.status!=='playing'&&gameState.status!=='paused';
            
            // 放置防御点按钮逻辑
            const placeDefenseBtn = document.getElementById('placeDefenseBtn');
            if (gameState.isPlacingMode) {
                placeDefenseBtn.textContent = i18n[gameState.settings.language].confirmPlacement;
                placeDefenseBtn.disabled = false;
            } else {
                placeDefenseBtn.textContent = i18n[gameState.settings.language].placeDefense;
                placeDefenseBtn.disabled = totalPoints < 3;
            }
            
            const lab=document.getElementById('theoremLabel');
            lab.innerHTML=gameState.geometry.activeTheorems.length?gameState.geometry.activeTheorems.map(t=>`<span class="theorem-tag">${i18n[gameState.settings.language][t.id]}</span>`).join(''):`<span data-i18n="noTheorem">${i18n[gameState.settings.language].noTheorem}</span>`;
            
            // 显示已选择的天赋
            const selectedTalentsList = document.getElementById('selectedTalentsList');
            if (gameState.player.selectedTalents && gameState.player.selectedTalents.length > 0) {
                selectedTalentsList.innerHTML = gameState.player.selectedTalents.map(t => `
                    <div class="talent-item unlocked">
                        <strong>${t.name[gameState.settings.language]}</strong>
                        <p>${t.desc[gameState.settings.language]}</p>
                        <small>Lv.${t.level}</small>
                    </div>
                `).join('');
            } else {
                selectedTalentsList.innerHTML = '<p style="text-align: center; color: #666;">暂无选择的天赋</p>';
            }
        }

        function draw(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const {centerX,centerY,radius}=gameState.canvas;
            ctx.beginPath();ctx.arc(centerX,centerY,radius,0,Math.PI*2);ctx.strokeStyle='var(--text-color)';ctx.lineWidth=2;ctx.stroke();
            ctx.beginPath();ctx.arc(centerX,centerY,6,0,Math.PI*2);ctx.fillStyle='var(--color-center)';ctx.fill();
            
            // 绘制所有保存的几何图形
            gameState.savedGeometries.forEach(geometry => {
                geometry.lines.forEach(l=>l.draw(ctx));
                geometry.placedPoints.forEach(p=>p.draw(ctx));
            });
            
            // 绘制当前正在编辑的几何图形
            gameState.geometry.lines.forEach(l=>l.draw(ctx));
            gameState.geometry.placedPoints.forEach(p=>p.draw(ctx));
            
            gameState.combat.monsters.forEach(m=>m.draw(ctx));
            gameState.combat.bullets.forEach(b=>b.draw(ctx));
        }

        function detectTheorems(){
            const pts=gameState.geometry.placedPoints;
            const {centerX,centerY,radius}=gameState.canvas;
            gameState.geometry.activeTheorems=[];
            
            const circlePoints=pts.filter(p=>p.type==='circle');
            const centerPoints=pts.filter(p=>p.type==='center');
            const outerPoints=pts.filter(p=>p.type==='outer');
            
            if(circlePoints.length>=2 && centerPoints.length>=1){
                gameState.geometry.activeTheorems.push({id:'theorem1'});
            }
            
            if(circlePoints.length>=3){
                for(let i=0;i<circlePoints.length;i++){
                    const p1=circlePoints[i];
                    const p2=circlePoints[(i+1)%circlePoints.length];
                    const d1=getDistance(p1.x,p1.y,p2.x,p2.y);
                    if(Math.abs(d1-2*radius)<20){
                        gameState.geometry.activeTheorems.push({id:'theorem2'});
                        break;
                    }
                }
            }
            
            if(circlePoints.length>=4){
                gameState.geometry.activeTheorems.push({id:'theorem3'});
            }
            
            if(outerPoints.length>=1 && circlePoints.length>=1){
                gameState.geometry.activeTheorems.push({id:'theorem4'});
            }
            
            if(outerPoints.length>=1 && circlePoints.length>=2){
                gameState.geometry.activeTheorems.push({id:'theorem5'});
            }
            
            if(circlePoints.length>=2){
                gameState.geometry.activeTheorems.push({id:'theorem6'});
            }
            
            if(circlePoints.length>=2){
                gameState.geometry.activeTheorems.push({id:'theorem7'});
            }
            
            if(centerPoints.length>=1 && circlePoints.length>=2){
                gameState.geometry.activeTheorems.push({id:'theorem8'});
            }
        }
        
        function closeShape(){
            const pts=gameState.geometry.placedPoints;if(pts.length<2)return;
            gameState.geometry.lines=[];
            for(let i=0;i<pts.length;i++){const p1=pts[i],p2=pts[(i+1)%pts.length];gameState.geometry.lines.push(new Line(p1.x,p1.y,p2.x,p2.y,'line'))}
            detectTheorems();
            gameState.geometry.isClosed=true;
            
            // 保存当前几何图形（深拷贝，保留对象方法）
            const savedGeometry = {
                placedPoints: gameState.geometry.placedPoints.map(p => new Point(p.x, p.y, p.type)),
                lines: gameState.geometry.lines.map(l => new Line(l.x1, l.y1, l.x2, l.y2, l.type)),
                activeTheorems: [...gameState.geometry.activeTheorems],
                isClosed: gameState.geometry.isClosed
            };
            gameState.savedGeometries.push(savedGeometry);
            
            sounds.close();updateUI();
        }

        function spawnMonsters(){
            const {width,height}=gameState.canvas;const w=gameState.combat.wave;
            const e=[{x:0,y:Math.random()*height},{x:width,y:Math.random()*height},{x:Math.random()*width,y:0},{x:Math.random()*width,y:height}];
            for(let i=0;i<5+w*2;i++){const p=e[Math.floor(Math.random()*4)];gameState.combat.monsters.push(new Monster(p.x,p.y,'normal',w))}
            gameState.combat.wave++;gameState.combat.lastWaveTime=Date.now();updateUI();
        }

        function spawnBullets(){
            const {centerX,centerY}=gameState.canvas;
            const t=getNearestMonster(centerX,centerY);if(!t)return;
            const baseDamage=gameState.combat.baseDamage;
            const damageMultiplier=gameState.player.damageMultiplier;
            let bulletDamage=baseDamage*damageMultiplier;
            if(gameState.geometry.activeTheorems.length>0){
                bulletDamage*=(1+gameState.geometry.activeTheorems.length*0.2);
            }
            gameState.savedGeometries.forEach(geometry=>{
                if(geometry.activeTheorems.length>0){
                    bulletDamage*=(1+geometry.activeTheorems.length*0.1);
                }
            });
            gameState.combat.bullets.push(new Bullet(centerX,centerY,t,bulletDamage));
            gameState.combat.lastBulletTime=Date.now();
        }

        function checkLevelUp(){
            while(gameState.player.exp>=gameState.player.expToNextLevel){
                gameState.player.exp-=gameState.player.expToNextLevel;gameState.player.level++;
                gameState.player.expToNextLevel=Math.floor(gameState.player.expToNextLevel*1.5);
                sounds.level();gameState.status='paused';
                
                // 每5级允许选择天赋
                if (gameState.player.level % 5 === 0) {
                    showTalentSelection();
                } else {
                    // 普通升级，选择点数
                    document.getElementById('levelUpModal').classList.add('active');
                }
                
                updateUI();
            }
        }
        
        // 天赋选择函数
        function showTalentSelection() {
            // 生成3个随机天赋选项
            const availableTalents = talentTree.filter(t => 
                t.level <= gameState.player.level && 
                (!gameState.player.selectedTalents || !gameState.player.selectedTalents.some(st => st.id === t.id))
            );
            
            // 如果没有可用天赋，就显示普通升级选项
            if (availableTalents.length < 3) {
                document.getElementById('levelUpModal').classList.add('active');
                return;
            }
            
            // 随机选择3个天赋
            const shuffled = availableTalents.sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);
            
            // 更新天赋选择模态框
            const modal = document.getElementById('levelUpModal');
            const options = modal.querySelector('.levelup-options');
            
            options.innerHTML = selected.map(t => `
                <div class="levelup-option" data-talent-id="${t.id}">
                    <div class="option-icon" style="background-color: var(--color-line); border-radius: 50%;"></div>
                    <div>
                        <strong>${t.name[gameState.settings.language]}</strong>
                        <p style="font-size: 12px; margin: 5px 0;">${t.desc[gameState.settings.language]}</p>
                        <small>Lv.${t.level}</small>
                    </div>
                </div>
            `).join('');
            
            // 添加点击事件
            options.querySelectorAll('.levelup-option').forEach(option => {
                option.onclick = function() {
                    const talentId = this.dataset.talentId;
                    const talent = talentTree.find(t => t.id === talentId);
                    
                    // 应用天赋效果
                    talent.effect(gameState);
                    
                    // 保存已选择的天赋
                    if (!gameState.player.selectedTalents) {
                        gameState.player.selectedTalents = [];
                    }
                    gameState.player.selectedTalents.push(talent);
                    
                    // 关闭模态框
                    modal.classList.remove('active');
                    gameState.status = 'playing';
                    updateUI();
                    sounds.click();
                };
            });
            
            // 显示模态框
            modal.classList.add('active');
        }

        function gameOver(){
            gameState.status='gameOver';cancelAnimationFrame(anim);
            const currentHigh = parseInt(localStorage.getItem('high') || 0);
            const newHigh = Math.max(gameState.combat.score, currentHigh);
            localStorage.setItem('high', newHigh);
            document.getElementById('finalScoreText').textContent=gameState.combat.score;
            document.getElementById('finalWaveText').textContent=gameState.combat.wave-1;
            document.getElementById('highScoreText').textContent=newHigh;
            document.getElementById('gameOverModal').classList.add('active');
        }

        function gameLoop(){
            if(gameState.status!=='playing'){anim=requestAnimationFrame(gameLoop);return}
            const now=Date.now();const {centerX,centerY,radius}=gameState.canvas;
            if(now-gameState.combat.lastWaveTime>=gameState.combat.waveInterval&&gameState.combat.monsters.length===0)spawnMonsters();
            if(now-gameState.combat.lastBulletTime>=gameState.combat.bulletInterval)spawnBullets();

            for(let i=gameState.combat.monsters.length-1;i>=0;i--){
                const m=gameState.combat.monsters[i];m.move();
                if(getDistance(m.x,m.y,centerX,centerY)<=m.r+5){gameState.centerHealth--;gameState.combat.monsters.splice(i,1);sounds.kill();if(gameState.centerHealth<=0){gameOver();return}}
                let d=0;gameState.geometry.lines.forEach(l=>{if(isPointOnLine(m.x,m.y,l.x1,l.y1,l.x2,l.y2,m.r))d+=gameState.combat.baseDamage*gameState.player.damageMultiplier});gameState.savedGeometries.forEach(geometry=>{geometry.lines.forEach(l=>{if(isPointOnLine(m.x,m.y,l.x1,l.y1,l.x2,l.y2,m.r))d+=gameState.combat.baseDamage*gameState.player.damageMultiplier})});
                if(d&&m.hit(d)){gameState.combat.score+=m.wave*10;gameState.player.exp+=m.wave*5;gameState.combat.monsters.splice(i,1);sounds.kill();checkLevelUp()}
            }

            for(let i=gameState.combat.bullets.length-1;i>=0;i--){
                const b=gameState.combat.bullets[i];if(!b.move()){gameState.combat.bullets.splice(i,1);continue}
                if(b.hit()){if(b.target.hit(b.damage)){gameState.combat.score+=b.target.wave*10;gameState.player.exp+=b.target.wave*5;gameState.combat.monsters.splice(gameState.combat.monsters.indexOf(b.target),1);sounds.kill();checkLevelUp()}gameState.combat.bullets.splice(i,1)}
            }

            draw();updateUI();anim=requestAnimationFrame(gameLoop);
        }

        function initGame(){
            gameState.status='paused';
            gameState.isPlacingMode=false;
            gameState.player={level:1,exp:0,expToNextLevel:100,points:{circle:1,center:1,outer:1},selectedTalents:[],damageMultiplier:1,bulletCountMultiplier:1};
            gameState.geometry={placedPoints:[],maxPoints:5,lines:[],activeTheorems:[],isClosed:false,selectedPointType:'circle'};
            gameState.combat={baseDamage:10,monsters:[],bullets:[],wave:1,score:0,lastWaveTime:Date.now(),waveInterval:10000,lastBulletTime:0,bulletInterval:500};
            tempPoints=null;
            
            document.querySelectorAll('.point-btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('circlePointBtn').classList.add('active');

            updateUI();
            document.getElementById('startModal').classList.remove('active');
            document.getElementById('gameOverModal').classList.remove('active');
            if(anim)cancelAnimationFrame(anim);gameLoop();
            
            // 显示提示
            alert(i18n[gameState.settings.language].clickToPlaceDefense);
        }

        function startGame(){
            // 直接刷新页面来重新开始游戏
            location.reload();
        }

        function togglePause(){gameState.status=gameState.status==='playing'?'paused':'playing';updateUI()}

        function canvasClick(e){
            if(!gameState.isPlacingMode)return;
            const pts=gameState.geometry.placedPoints;if(pts.length>=5)return;
            const type=gameState.geometry.selectedPointType;if(gameState.player.points[type]<=0)return;

            const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
            const {centerX,centerY,radius}=gameState.canvas;const d=getDistance(x,y,centerX,centerY);
            let valid=false,fx=x,fy=y;

            switch(type){
                case 'center':
                    if(d<radius-5){fx=centerX;fy=centerY;valid=true}
                    break;
                case 'circle':
                    if(Math.abs(d-radius)<=15){const k=radius/d;fx=centerX+(x-centerX)*k;fy=centerY+(y-centerY)*k;valid=true}
                    break;
                case 'outer':
                    if(d>=radius-5){valid=true}
                    break;
            }

            if(valid){
                gameState.geometry.placedPoints.push(new Point(fx,fy,type));
                gameState.player.points[type]--;gameState.geometry.isClosed=false;
                sounds.place();draw();updateUI();
            }
        }

        let tempPoints = null;
        
        function placeDefense() {
            if (gameState.isPlacingMode) {
                // 确认放置
                if (gameState.geometry.placedPoints.length >= 3) {
                    closeShape();
                    gameState.isPlacingMode = false;
                    gameState.status = 'playing';
                    tempPoints = null;
                } else {
                    // 少于3个点，显示提示
                    document.getElementById('currentPointsText').textContent = `当前已放置点数：${gameState.geometry.placedPoints.length}，需要至少3个点`;
                    document.getElementById('placeDefenseModal').classList.add('active');
                }
            } else {
                // 进入放置模式，开始新图形绘制
                const totalPoints = gameState.player.points.circle + gameState.player.points.center + gameState.player.points.outer;
                if (totalPoints >= 3) {
                    // 重置几何图形，开始新的图形制作
                    gameState.geometry = {
                        placedPoints: [],
                        maxPoints: 5,
                        lines: [],
                        activeTheorems: [],
                        isClosed: false,
                        selectedPointType: 'circle'
                    };
                    gameState.isPlacingMode = true;
                    gameState.status = 'paused';
                    tempPoints = {
                        circle: gameState.player.points.circle,
                        center: gameState.player.points.center,
                        outer: gameState.player.points.outer
                    };
                }
            }
            sounds.click();
            updateUI();
            draw();
        }
        
        function cancelDefense() {
            if (tempPoints) {
                gameState.player.points = { ...tempPoints };
                // 重置几何图形，准备开始新的绘制
                gameState.geometry = {
                    placedPoints: [],
                    maxPoints: 5,
                    lines: [],
                    activeTheorems: [],
                    isClosed: false,
                    selectedPointType: 'circle'
                };
                tempPoints = null;
            }
            gameState.isPlacingMode = false;
            document.getElementById('placeDefenseModal').classList.remove('active');
            draw();
            updateUI();
            sounds.click();
        }
        
        function continueAdding() {
            document.getElementById('placeDefenseModal').classList.remove('active');
            sounds.click();
        }

        window.addEventListener('load',()=>{loadSettings();document.getElementById('startModal').classList.add('active');draw();updateUI()});
        canvas.addEventListener('click',canvasClick);
        canvas.addEventListener('touchend',e=>{e.preventDefault();canvasClick(e.changedTouches[0])});

        document.getElementById('circlePointBtn').onclick=()=>{gameState.geometry.selectedPointType='circle';document.querySelectorAll('.point-btn').forEach(b=>b.classList.remove('active'));document.getElementById('circlePointBtn').classList.add('active');sounds.click()};
        document.getElementById('centerPointBtn').onclick=()=>{gameState.geometry.selectedPointType='center';document.querySelectorAll('.point-btn').forEach(b=>b.classList.remove('active'));document.getElementById('centerPointBtn').classList.add('active');sounds.click()};
        document.getElementById('outerPointBtn').onclick=()=>{gameState.geometry.selectedPointType='outer';document.querySelectorAll('.point-btn').forEach(b=>b.classList.remove('active'));document.getElementById('outerPointBtn').classList.add('active');sounds.click()};

        document.getElementById('confirmStartBtn').onclick=()=>{initGame();sounds.click()};
        document.getElementById('startBtn').onclick=()=>{startGame();sounds.click()};
        document.getElementById('pauseBtn').onclick=()=>{togglePause();sounds.click()};
        document.getElementById('placeDefenseBtn').onclick=()=>{placeDefense()};
        document.getElementById('restartBtn').onclick=()=>{startGame();sounds.click()};
        document.getElementById('settingBtn').onclick=()=>{document.getElementById('settingModal').classList.add('active');sounds.click()};
        document.getElementById('closeSettingBtn').onclick=()=>{saveSettings();applySettings();document.getElementById('settingModal').classList.remove('active');sounds.click()};
        document.getElementById('cancelDefenseBtn').onclick=()=>{cancelDefense()};
        document.getElementById('continueAddBtn').onclick=()=>{continueAdding()};

        document.getElementById('circleOption').onclick=()=>{gameState.player.points.circle++;document.getElementById('levelUpModal').classList.remove('active');gameState.status='playing';updateUI();sounds.click()};
        document.getElementById('centerOption').onclick=()=>{gameState.player.points.center++;document.getElementById('levelUpModal').classList.remove('active');gameState.status='playing';updateUI();sounds.click()};
        document.getElementById('outerOption').onclick=()=>{gameState.player.points.outer++;document.getElementById('levelUpModal').classList.remove('active');gameState.status='playing';updateUI();sounds.click()};

        document.getElementById('darkModeSwitch').onclick=function(){this.classList.toggle('active');gameState.settings.darkMode=this.classList.contains('active');applySettings()};
        document.getElementById('colorblindSwitch').onclick=function(){this.classList.toggle('active');gameState.settings.colorblindMode=this.classList.contains('active');applySettings()};
        document.getElementById('sfxSwitch').onclick=function(){this.classList.toggle('active');gameState.settings.sfx=this.classList.contains('active')};
        document.getElementById('languageSelect').onchange=function(){gameState.settings.language=this.value;applyLanguage()};
        document.getElementById('fontSizeSelect').onchange=function(){gameState.settings.fontSize=this.value;document.documentElement.setAttribute('data-font',this.value)};
    </script>
</body>
</html>
